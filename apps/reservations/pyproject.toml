[project]
name = "reservations"
version = "0.1.0"
description = "Bulk reservations API (FastAPI + PgQueuer) - proof of concept"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54",
    "asyncpg>=0.32",
    "pydantic>=2.12",
    "pydantic-settings>=2.15.0",
    # Same pin as apps/worker: PgQueuer 1.0 changes the queue table layout.
    # migrations/001_init.sql embeds the 0.x schema generated by this version.
    "pgqueuer[asyncpg]>=0.26.3,<1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reservations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
