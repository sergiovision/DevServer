[project]
name = "devserver-worker"
version = "0.1.0"
description = "DevServer autonomous coding agent worker"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54",
    "asyncpg>=0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "pydantic-settings>=2.15.0",
    # Pinned below 1.0: PgQueuer 1.0 is a breaking "hard reset" that changes the
    # queue table schema (new 'failed' status + 'attempts' column). The Next.js
    # producer (apps/web/src/lib/queue.ts) and database/migrations/001_initial.sql
    # hardcode the 0.x table layout/status enum, so a major bump breaks the queue.
    "pgqueuer[asyncpg]>=0.26.3,<1.0",
    "httpx>=0.28.1",
    # Ed25519 verification of capitaltools-issued Pro license tokens
    # (services/pro/licensing). Harmless in the free edition.
    "cryptography>=50",
    "pgvector>=0.5.0",
    # Local, CPU/ONNX text embeddings for semantic memory recall — replaces
    # the old Voyage cloud API (services/embeddings.py). Pulls onnxruntime +
    # huggingface-hub for the model download/cache.
    "fastembed>=0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28.1",
]
# Governance-grade OpenTelemetry export (opt-in). Kept out of the default
# install so deployments that don't use OTEL stay lean; services/telemetry.py
# no-ops gracefully when these are absent. Enable with:
#   uv sync --extra otel   (and set OTEL_EXPORTER_OTLP_ENDPOINT)
otel = [
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[project.scripts]
devserver-worker = "main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
