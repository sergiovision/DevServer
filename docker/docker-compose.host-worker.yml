# DevServer v2 — "worker on host" topology.
#
# Runs PostgreSQL + the Next.js web dashboard in Docker, but NOT the Python
# worker. You run the worker directly on your host OS, so it spawns the AI
# provider CLIs (claude / glm / gemini / codex) as host processes using the
# logins already set up on your machine (`claude login`, `codex login`, the
# Gemini OAuth, GLM auth, …). Nothing to install in an image, no credential
# mounts.
#
# This is a SELF-CONTAINED compose file (not an override) — it deliberately
# omits the `worker` service so `web` does not wait on a container that will
# never exist.
#
# ── Usage ────────────────────────────────────────────────────────────────────
#   1. Start DB + web:
#        cd docker && docker compose -f docker-compose.host-worker.yml up -d --build
#   2. Run the worker on the host (separate terminal, repo root):
#        cd apps/worker
#        cp ../../config/.env.example .env   # then edit (it is already host-shaped)
#        uv run uvicorn src.main:app --host 0.0.0.0 --port 8000
#
# The host worker reaches Postgres on localhost:5432 (published below); the
# containerised web reaches the host worker via host.docker.internal:8000.
#
# ── One required .env constraint ─────────────────────────────────────────────
# So the dashboard's /logs viewer can read the host worker's logs, set in the
# worker's .env:
#     DEVSERVER_ROOT=<absolute path to this repo root>
#     LOG_DIR=${DEVSERVER_ROOT}/logs/tasks
# The `web` service below bind-mounts <repo>/logs, which is exactly where the
# host worker writes when DEVSERVER_ROOT is the repo root.
# Also confirm DATABASE_URL points at 127.0.0.1:5432 (the published DB port),
# not the `postgres` service name (that name only resolves inside Docker).

services:

  # ── PostgreSQL 17 + pgvector ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: devserver-postgres
    # The bundled DB only starts under the `bundled-db` profile. The Settings /
    # Setup-wizard Database card writes DEVSERVER_HOST_DB=1 for the Host-OS /
    # External modes, and the lifecycle scripts then drop this profile so the
    # redundant container never starts. `docker compose --profile bundled-db up`
    # (the scripts' default) runs it.
    profiles: ["bundled-db"]
    environment:
      POSTGRES_USER:     devserver
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
      POSTGRES_DB:       devserver
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Published so the HOST worker can reach the DB on localhost:5432.
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devserver -d devserver"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── DevServer Web (Next.js + queue producer + WebSocket) ─────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: devserver-web
    # Lets the container resolve the host via host.docker.internal on Linux
    # too (Docker Desktop on macOS/Windows provides it automatically).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The web CONTAINER reaches Postgres via the container-perspective vars
      # (PGHOST_CONTAINER/PGPORT_CONTAINER), which differ from the host-side PG*
      # the host worker uses: bundled → postgres:5432 (service DNS + internal
      # port); Host-OS → host.docker.internal:<port>; External → the remote
      # host:port. The Database card sets these automatically per mode.
      DATABASE_URL: postgresql://${PGUSER:-devserver}:${PGPASSWORD:-changeme}@${PGHOST_CONTAINER:-postgres}:${PGPORT_CONTAINER:-5432}/${PGDATABASE:-devserver}
      PGHOST:     ${PGHOST_CONTAINER:-postgres}
      PGPORT:     "${PGPORT_CONTAINER:-5432}"
      PGUSER:     ${PGUSER:-devserver}
      PGPASSWORD: ${PGPASSWORD:-changeme}
      PGDATABASE: ${PGDATABASE:-devserver}
      # Worker runs on the HOST — reach it across the container boundary.
      WORKER_URL: ${WORKER_URL:-http://host.docker.internal:8000}
      DEPLOY_MODE: docker
      DS_LOG_DIR: /app/logs
      WEB_PORT: ${WEB_PORT:-3200}
      NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL:-ws://localhost:3200/api/ws}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3200/api}
    ports:
      - "${WEB_PORT:-3200}:${WEB_PORT:-3200}"
    depends_on:
      postgres:
        condition: service_healthy
        # required:false → when the bundled-db profile is off (Host-OS /
        # External modes) the postgres service isn't created, and web must
        # still start instead of erroring on a missing dependency.
        required: false
      # NB: no `worker` dependency — the worker is a host process here.
    volumes:
      # The /logs viewer reads task logs from this dir. The host worker writes
      # them to <repo>/logs on the host, so bind-mount that same dir in (rather
      # than the named volume used by the all-in-Docker topology).
      - ../logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
