# DevServer — release compose. Runs prebuilt images; builds nothing.
#
#   docker compose -p devserver -f docker-compose.release.yml --profile bundled-db up -d
#
# (scripts/setup-release.sh writes docker/.env and runs this for you;
#  scripts/rundockerhub.sh re-pulls and restarts it afterwards.)
#
# ONE IMAGE PER TIER, out of the one docker/Dockerfile:
#   :worker-*  -> FastAPI + PgQueuer consumer  (:8000)   (--target worker)
#   :web-*     -> Next.js dashboard + /api/ws  (:3200)   (--target web)
# Each carries its own CMD and HEALTHCHECK, so nothing here selects a role.
#
# WHERE THE IMAGES COME FROM. The default stack (docker-compose.yml) builds
# local `devserver:*` tags from the checkout. This file is for hosts that should
# NOT build: it pulls ${DEVSERVER_IMAGE} (default: the maintainer's Docker Hub
# repository, dockersergio/devserver) — or point DEVSERVER_IMAGE at your own
# registry, after pushing tags you built with:
#   docker build -f docker/Dockerfile --target worker -t <repo>:worker-<tag> .
#   docker build -f docker/Dockerfile --target web    -t <repo>:web-<tag> .
#
# Pin DEVSERVER_WORKER_VERSION / DEVSERVER_WEB_VERSION to a matching pair of
# tags for reproducible deployments — build both from the same commit and keep
# them in step. The `*-latest` defaults are moving pointers, fine for trying it
# out and not for production; with them, set DEVSERVER_PULL_POLICY=always so
# `up` cannot silently keep running the layers you happen to have cached.
#
# THIS FILE IS DELIBERATELY SELF-CONTAINED — it can be copied to a host on its
# own, with no repo alongside it, which is also why (unlike docker-compose.yml)
# it does not bind-mount ../database/migrations: the worker applies the schema
# itself on an empty database. That standalone-ness is the one duplication in
# this directory worth keeping, so scripts/compose-check.sh asserts its
# environment keys still match docker-compose.yml rather than letting the two
# silently drift.

# ── Shared definitions ───────────────────────────────────────────────────────
x-devserver-common: &devserver-common
  pull_policy: ${DEVSERVER_PULL_POLICY:-missing}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

x-db-env: &db-env
  PGHOST:     ${PGHOST_CONTAINER:-postgres}
  PGPORT:     "${PGPORT_CONTAINER:-5432}"
  PGUSER:     ${PGUSER:-devserver}
  PGPASSWORD: ${PGPASSWORD:-changeme}
  PGDATABASE: ${PGDATABASE:-devserver}

services:
  # Bundled database. Omit the `bundled-db` profile to point at your own
  # Postgres instead (set PGHOST_CONTAINER / PGPORT_CONTAINER accordingly).
  # pgvector is required, not optional: semantic memory recall uses it.
  postgres:
    image: pgvector/pgvector:pg17
    # A fixed container_name is stronger than the project namespace: it is
    # global to the daemon, so `-p other` does NOT avoid a collision and the
    # second stack dies with "container name /devserver-postgres is already in
    # use". The name stays fixed by default because scripts/migrate.sh,
    # dbrestart.sh and the backup/restore pair all `docker exec` it by name;
    # set DEVSERVER_STACK to run a second stack alongside this one.
    container_name: ${DEVSERVER_STACK:-devserver}-postgres
    profiles: ["bundled-db"]
    environment:
      POSTGRES_USER:     ${PGUSER:-devserver}
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
      POSTGRES_DB:       ${PGDATABASE:-devserver}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # The tiers reach this over the compose network by service name and do
      # not need the published port — but psql, the backup/restore pair and a
      # host-side worker (docker-compose.host-worker.yml) all address it as
      # PGHOST:PGPORT on the host, and got ECONNREFUSED while this was absent.
      # Loopback by default, matching the worker port above: nothing here
      # authenticates beyond the DB password.
      - "${PGBIND:-127.0.0.1}:${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-devserver} -d ${PGDATABASE:-devserver}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *devserver-common
    image: ${DEVSERVER_IMAGE:-dockersergio/devserver}:${DEVSERVER_WORKER_VERSION:-worker-latest}
    container_name: ${DEVSERVER_STACK:-devserver}-worker
    # Passes docker/.env straight through, so first-start bootstrap knobs —
    # DEVSERVER_SETUP_COMPLETED and any number of DEVSERVER_SETTING_<KEY>
    # entries — reach the container without a compose edit per key. Compose
    # applies env_file first, so every explicit value below still wins.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-env
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-devserver}:${PGPASSWORD:-changeme}@${PGHOST_CONTAINER:-postgres}:${PGPORT_CONTAINER:-5432}/${PGDATABASE:-devserver}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:   ${TELEGRAM_CHAT_ID:-}
      # See docker-compose.yml for what these two do. Telegram allows one
      # getUpdates consumer per bot token; notifications are unrestricted.
      INSTANCE_NAME: ${INSTANCE_NAME:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
      # The web tier is a separate container, so the worker's own localhost is
      # not it. Without this every enqueue-from-worker path (task create/run,
      # decomposer, the MCP task tools) failed with ConnectError and returned
      # enqueued=false. `web` is the service name on the shared network.
      WEB_URL: ${WEB_URL:-http://web:3200}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      CLAUDE_BIN: claude
      DEVSERVER_ROOT: /app
      # The .env the Settings/Setup Database card writes. It must be a
      # devserver-owned path on a VOLUME: /app is root-owned, so a save
      # there fails, and an unmounted path would not survive a recreate.
      DEVSERVER_ENV_FILE: /app/config/.env
      WORKTREE_DIR:   /app/worktrees
      LOG_DIR:        /app/logs/tasks
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      # Guards the one worker endpoint that executes something on the host (the
      # Ask Agent approved-action runner). Port 8000 has no other auth — set
      # this, and do not expose that port beyond your host.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    ports:
      # Bound to loopback: this port has no authentication beyond
      # INTERNAL_API_TOKEN. WORKER_BIND=0.0.0.0 opens it deliberately.
      - "${WORKER_BIND:-127.0.0.1}:${WORKER_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - worktrees:/app/worktrees
      - worker_logs:/app/logs
      # Vendor agent CLIs (claude / codex / agy), installed on first use — the
      # image ships none. This volume makes the ~60–90s download a
      # once-per-deployment cost instead of once per container.
      - agent_clis:/opt/agents
      - worker_config:/app/config
      # Reuse the HOST's CLIs instead of downloading — LINUX HOSTS ONLY. These
      # are native executables, so a macOS/Windows host binary cannot exec in
      # the Linux container; use the download, or run the agent tier on the
      # host (docker-compose.host-worker.yml). Uncomment and set
      # CLAUDE_BIN=/host-clis/bin/claude in .env; the auto-installer stands
      # down for any binary named by a *_BIN override.
      #   - ${HOST_NPM_ROOT:-/usr/lib/node_modules}:/host-clis/node_modules:ro
      #   - ${HOST_NPM_BIN:-/usr/bin}:/host-clis/bin:ro
      # Max/subscription billing: mount the host's CLI auth instead of API keys.
      # Requires `claude login` on the HOST first. Target is /home/devserver,
      # not /root — the container runs as unprivileged uid 10001.
      # - ${CLAUDE_CONFIG_DIR:-${HOME}/.claude}:/home/devserver/.claude:ro

  web:
    <<: *devserver-common
    image: ${DEVSERVER_IMAGE:-dockersergio/devserver}:${DEVSERVER_WEB_VERSION:-web-latest}
    container_name: ${DEVSERVER_STACK:-devserver}-web
    environment:
      <<: *db-env
      # server.ts reads DATABASE_URL; lib/db.ts reads the discrete PG* vars
      # merged in from *db-env above.
      DATABASE_URL: postgresql://${PGUSER:-devserver}:${PGPASSWORD:-changeme}@${PGHOST_CONTAINER:-postgres}:${PGPORT_CONTAINER:-5432}/${PGDATABASE:-devserver}
      WORKER_URL: http://worker:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      DEPLOY_MODE: docker
      DS_LOG_DIR: /app/logs
      WEB_PORT: ${WEB_PORT:-3200}
      NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL:-ws://localhost:3200/api/ws}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3200/api}
    ports:
      - "${WEB_PORT:-3200}:${WEB_PORT:-3200}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      worker:
        condition: service_healthy
    volumes:
      # Shared with the worker so the /logs viewer shows both tiers.
      - worker_logs:/app/logs

volumes:
  postgres_data:
  worktrees:
  worker_logs:
  # Agent CLIs installed on first use. Safe to delete: the next task that needs
  # a vendor re-fetches it.
  # Writable .env for the in-app Database card; see DEVSERVER_ENV_FILE.
  worker_config:
  agent_clis:
