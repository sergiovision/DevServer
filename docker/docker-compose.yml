# DevServer v2 — cross-platform stack (Linux, macOS, Windows).
#
# Usage:
#   cd docker && cp ../.env.example .env   # fill in credentials
#   docker compose up -d --build
#
# This default stack runs PostgreSQL inside Docker so it works out of the
# box on every platform — Windows users in particular must use this mode
# because Docker Desktop has no host Postgres to talk to.
#
# Linux users who already run PostgreSQL on the host can skip the bundled
# DB and point containers at host.docker.internal instead:
#
#   docker compose -f docker-compose.yml -f docker-compose.host-db.yml up -d --build
#
# For Max subscription (Claude OAuth): mount your host Claude config dir.
# Uncomment the claude_auth line in the worker service below.

services:

  # ── PostgreSQL 17 + pgvector ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: devserver-postgres
    # Bundled DB only starts under the `bundled-db` profile. The Database card
    # writes DEVSERVER_HOST_DB=1 for Host-OS / External modes and the lifecycle
    # scripts then drop this profile, so the redundant container never starts.
    profiles: ["bundled-db"]
    environment:
      # devserver is created as superuser by Docker (required for CREATE EXTENSION vector).
      # The init SQL files' CREATE USER/DATABASE lines are no-ops since they already exist.
      POSTGRES_USER:     devserver
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
      POSTGRES_DB:       devserver
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # All migration files run automatically on first init (as postgres superuser)
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devserver -d devserver"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── DevServer Web (Next.js + queue producer + WebSocket) ─────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: devserver-web
    # Resolve the host (for Host-OS / External DB modes) on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database — both DATABASE_URL and the discrete PG* vars are set because
      # different code paths read different forms (server.ts uses DATABASE_URL,
      # lib/db.ts uses PG*). Container-perspective host/port come from
      # PGHOST_CONTAINER/PGPORT_CONTAINER (default postgres:5432 = bundled);
      # the Database card rewrites them for Host-OS / External modes.
      DATABASE_URL: postgresql://${PGUSER:-devserver}:${PGPASSWORD:-changeme}@${PGHOST_CONTAINER:-postgres}:${PGPORT_CONTAINER:-5432}/${PGDATABASE:-devserver}
      PGHOST:     ${PGHOST_CONTAINER:-postgres}
      PGPORT:     "${PGPORT_CONTAINER:-5432}"
      PGUSER:     ${PGUSER:-devserver}
      PGPASSWORD: ${PGPASSWORD:-changeme}
      PGDATABASE: ${PGDATABASE:-devserver}
      # Worker — internal service URL (not localhost)
      WORKER_URL: http://worker:8000
      # Deploy mode for versioning
      DEPLOY_MODE: docker
      # /logs viewer reads files from this dir. Shared volume with the worker.
      DS_LOG_DIR: /app/logs
      # Port the Next.js server binds to inside the container.
      WEB_PORT: ${WEB_PORT:-3200}
      # Public URLs for browser clients
      NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL:-ws://localhost:3200/api/ws}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3200/api}
    ports:
      - "${WEB_PORT:-3200}:${WEB_PORT:-3200}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # absent under Host-OS / External modes (profile off)
      worker:
        condition: service_healthy
    volumes:
      # Shared with the worker so the /logs viewer can read both files
      - worker_logs:/app/logs
    restart: unless-stopped

  # ── DevServer Worker (Python FastAPI + PgQueuer consumer + Claude CLI) ───
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: devserver-worker
    # Resolve the host (for Host-OS / External DB modes) on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database — asyncpg driver. Container-perspective host/port default to
      # the bundled postgres:5432; the Database card rewrites
      # PGHOST_CONTAINER/PGPORT_CONTAINER for Host-OS / External modes.
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-devserver}:${PGPASSWORD:-changeme}@${PGHOST_CONTAINER:-postgres}:${PGPORT_CONTAINER:-5432}/${PGDATABASE:-devserver}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID:   ${TELEGRAM_CHAT_ID}
      # Claude — API mode: set key below. Max mode: leave empty + uncomment claude_auth volume.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_BIN: claude
      # Paths inside container
      DEVSERVER_ROOT: /app
      WORKTREE_DIR:   /app/worktrees
      LOG_DIR:        /app/logs/tasks
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # absent under Host-OS / External modes (profile off)
    volumes:
      # Persistent worktrees: bare repos + checked-out branches survive restarts
      - worktrees:/app/worktrees
      - worker_logs:/app/logs
      # ── Max subscription (Claude OAuth) ──────────────────────────────────
      # Uncomment to use Claude Max instead of API key.
      # Requires `claude login` to have been run on the HOST machine first.
      # Windows (Docker Desktop) path looks like: C:\Users\<you>\.claude
      # - ${CLAUDE_CONFIG_DIR:-${HOME}/.claude}:/root/.claude:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  # Worktrees: bare repos + git worktrees for all coding tasks.
  # Stored in a named volume so clones survive container rebuilds.
  worktrees:
  worker_logs:
